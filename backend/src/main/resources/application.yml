server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mall_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASS:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  auth:
    enabled: true
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  jwt:
    secret: ${APP_JWT_SECRET:mallhub-demo-secret-change-in-prod-must-be-32-chars-min}
    expiry-hours: 24
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

springdoc:
  api-docs:
    path: /v3/api-docs
